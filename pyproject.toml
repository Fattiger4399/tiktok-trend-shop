[project]
name = "tiktok-trend-shop"
version = "0.1.0"
description = "Foundation services for a TikTok product trend-to-video workflow."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tk-foundation = "tiktok_trend_shop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
